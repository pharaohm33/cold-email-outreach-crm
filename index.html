const tabSay=t=>{try{TABCH&&TABCH.postMessage({t,id:TAB_ID})}catch(e){}};
const otherTabs=()=>Object.values(SEEN_TABS).filter(t=>Date.now()-t<70000).length;   /* other CRM tabs of this browser that answered in the last ~70 s (a hidden tab beats about once a minute) */
function leadLock(){try{return JSON.parse(localStorage.getItem('clipperLead')||'{}')}catch(e){return {}}}
function isLeader(){try{const L=leadLock(),now=Date.now();

window.addEventListener('beforeunload',()=>tabSay('bye'));window.addEventListener('pagehide',()=>{tabSay('bye');try{if(leadLock().id===TAB_ID)localStorage.removeItem('clipperLead')}catch(e){}});
let syncT,syncMsg='';
function setSync(m){syncMsg=m;const e=document.getElementById('sync');if(e)e.textContent=m}
/* Two CRM tabs (the one that opens at login plus yours) share one saved copy. When the other tab saved something newer, take it over IN PLACE: objects a running job already holds
   (a lead, the settings) stay the live ones, so a round in progress never writes its results into a copy that was thrown away. */
function adoptNewer(){try{const cur=JSON.parse(localStorage.getItem('clipperCRM')||'null');if(cur&&(cur._rev||0)>(S._rev||0)){
 const merge=(mine,inc)=>{const by=new Map((mine||[]).map(o=>[o&&o.id,o])),out=[];(inc||[]).forEach(o=>{const m=by.get(o.id);if(m&&m!==o){Object.keys(m).forEach(k=>{if(!(k in o))delete m[k]});Object.assign(m,o);out.push(m);by.delete(o.id)}else out.push(o)});by.forEach(o=>{if(o)out.push(o)});return out};
 const gone=new Set([...(cur.adGone||[]),...(S.adGone||[])]),nl=merge(S.leads,cur.leads),nad=cur.adLeads||S.adLeads?merge(S.adLeads,cur.adLeads).filter(l=>!gone.has(l.id)):undefined,sett=S.settings||{};

 Object.keys(sett).forEach(k=>{if(!(k in (cur.settings||{}))&&!(k in DEF.settings))delete sett[k]});Object.assign(sett,DEF.settings,cur.settings);next.settings=sett;
 Object.keys(S).forEach(k=>delete S[k]);Object.assign(S,next);return true}}catch(e){}return false}

const HSET=['autoStart','startConfirmed','keepDays','startTarget','sendMode','loomAuto','loomAutoSend','loomSendChecked','videoAutoApprove','autoFollowUps','cformOn','cformT1','cformConfirmed','cformFallbackHours','cformDaily','cformAnyTime','cformSubject','cformMsg','cformMsgT1','formWebsite','cformRound','cformAutoNext','cformSubjectT1','jitbitCheck','aiEmailCheck','trustHalcrus','halcrusTier','adVoice','videoName','videoHost','loomShow','keepLocalVideos','notifyReady','runStrategy','metaFallback','templateMode','emailOff','apprStats'];   /* same list as SETTINGS_KEYS in tools/crm_store.py (plus meta_resolved: the email templates with their defaults filled in) */
const h32=s=>{let h=2166136261;for(let i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)}return (h>>>0).toString(36)};
const jcopy=v=>JSON.parse(JSON.stringify(v));
const HS={base:new Map(),sbase:{},out:[],goneOut:[],sset:{},sdel:[],refetch:[],busy:false,again:false,timer:null,ok:null,err:'',at:0,lastLeader:undefined};

function hsQueue(p){const set=p.set?jcopy(p.set):{},del=p.del||[],a=HS.out.find(x=>x.id===p.id);

(function hsInit(){let st={};try{st=JSON.parse(localStorage.getItem('clipperCRMout')||'{}')}catch(e){}

/* what changed since the last hand-over, field by field (so the helper's own edits to the same lead are never overwritten wholesale) */
function hsCollect(){const seen=new Set();
 for(const l of (S.adLeads||[])){const id=String(l.id);seen.add(id);const cur=JSON.stringify(l),b=HS.base.get(id);if(b===cur)continue;
  if(b===undefined)hsQueue({id,set:l,del:[]});
  else{const bo=JSON.parse(b),set={},del=[];for(const k of Object.keys(l)){if(l[k]!==undefined&&JSON.stringify(l[k])!==JSON.stringify(bo[k]))set[k]=l[k]}for(const k of Object.keys(bo))if(l[k]===undefined)del.push(k);hsQueue({id,set,del})}

 HSET.forEach(k=>{const cur=S.settings[k]===undefined?undefined:JSON.stringify(S.settings[k]);if(cur===HS.sbase[k])return;HS.sbase[k]=cur;if(cur===undefined){delete HS.sset[k];if(!HS.sdel.includes(k))HS.sdel.push(k)}else{HS.sset[k]=S.settings[k];HS.sdel=HS.sdel.filter(x=>x!==k)}});
 let mj;try{mj=JSON.stringify(meta())}catch(e){mj=undefined}if(mj!==undefined&&mj!==HS.sbase.meta_resolved){HS.sbase.meta_resolved=mj;HS.sset.meta_resolved=JSON.parse(mj)}

async function hsRun(){if(HS.busy){HS.again=true;return}

 if(HS.lastLeader===false){S.adLeads=S.adLeads||[];HS.base=new Map(S.adLeads.map(l=>[String(l.id),JSON.stringify(l)]));HS.sbase={};HSET.forEach(k=>{HS.sbase[k]=S.settings[k]===undefined?undefined:JSON.stringify(S.settings[k])})}   /* this tab just became the one that talks to the helper: start from what it has now */

 try{hsCollect();const first=!S._hrev;
  sent={out:HS.out.splice(0),gone:HS.goneOut.splice(0),refetch:HS.refetch.splice(0),sset:HS.sset,sdel:HS.sdel};HS.sset={};HS.sdel=[];
  let r;try{const res=await fetch(RUNNER+'/crm/sync',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({rev:S._hrev||0,first,patches:sent.out,gone:sent.gone,refetch:sent.refetch,settings:{set:sent.sset,del:sent.sdel}})});r=await res.json();if(!res.ok||!r.ok)throw new Error((r&&r.error)||('HTTP '+res.status))}

function hsApply(r){let changed=false;S.adLeads=S.adLeads||[];const byId=new Map(S.adLeads.map(l=>[String(l.id),l]));

  else{S.adLeads.push(inc);byId.set(id,inc);HS.base.set(id,JSON.stringify(inc));changed=true}}

async function fitCheck(l,log){
 const prompt=`Use Google Search. Decide whether this YouTube show is run by a small independent owner who could decide ALONE to pay a freelancer $300 to $1,000 a month for short form video clips.
Show: ${l.name}
YouTube channel: ${l.url}
Website: ${l.web||'unknown'}
Subscribers: ${l.subs||'unknown'}
Big company signs (bad fit): a franchise or national or global brand, owned by or part of a larger media company or network, a corporate marketing department, roughly 50 or more employees, publicly traded, or the host is an employee and not the owner.
Good fit signs: the host is the owner, a solo person or a small team, their own agency, practice, brokerage, builder, coaching business or product.
Affordability signs: sponsors, paid products or programs, several revenue streams, a steady business.
Never guess. Use "unknown" when you cannot find it. Return ONLY a JSON object:
{"decider":"owner|team|corporate|unknown","size":"solo|small|mid|large|unknown","big_company":true or false,"can_afford":"yes|maybe|no|unknown","reasons":["one short reason","another"],"confidence":0.0 to 1.0}`;
 const t=await geminiCall(prompt,true,log);const m=t.match(/\{[\s\S]*\}/);if(!m)throw new Error('no answer');
 const o=JSON.parse(m[0].replace(/,\s*([\]}])/g,'$1'));
 l.fit={decider:String(o.decider||'unknown'),size:String(o.size||'unknown'),big:!!o.big_company,afford:String(o.can_afford||'unknown'),reasons:(o.reasons||[]).slice(0,3).map(String),conf:+o.confidence||0,at:Date.now()};save();return l.fit}
const applyFit=(l,o)=>{l.fit={decider:String(o.decider||'unknown'),size:String(o.size||'unknown'),big:!!o.big_company,afford:String(o.can_afford||'unknown'),reasons:(o.reasons||[]).slice(0,3).map(String),conf:+o.confidence||0,at:Date.now()}};

const IG_GUIDE=`WHAT THIS IS
A manual extra touch for the few prospects worth it. You post a short video pitch to a private Instagram story and tag the prospect. The idea is that the tag notifies them and your story shows at the front of their story bar, so it gets seen even when their DMs are flooded. Nobody has verified a specific open rate, so treat it as a test and count your own results.

WHEN TO USE IT
- Top prospects only: a named owner or marketing lead at a store with a high portal score. Not your whole list.
- One touch at a time: use it for people who have not answered email, and give an email at least 3 days first.
- Never on anyone who said no or opted out.

STEPS
1. Pick your top 25 (the button above) and press Find their Instagram accounts. Open each profile and check it is really that person or brand. Choose "tag person" or "tag brand" when both exist.
2. In Instagram, make a Close Friends list for this round. Add ONLY this round's prospects. The tool lists the handles to add. Set each to "Added to Close Friends".
3. Record a video of 30 seconds or less using the script below, in your own words:
   - Open with their name and ONE specific, true thing about their business or ads.
   - Give one useful idea for free.
   - One proof point or result (only a real one).
   - One ask: reply here or sign up (your link).
4. Post it as a story to Close Friends only, and tag the prospect with Instagram's own mention.
5. Set their status to "Story sent". The tool dates it and counts today's sends.
6. When they reply, set "Replied" or "Booked a call". If they decline, set "Not interested": they are marked do-not-contact.
7. After the round, remove them from the Close Friends list and clear the story before the next batch.

RULES
- Manual only. Never automate posting, tagging or messaging.
- 10 stories a day at most, and keep each round small. Mass tagging looks like spam and can get an account restricted.
- Be truthful in the video: no invented results and no claiming you reviewed ads you did not look at.
- Stop immediately if someone asks you to.

   else if((m=u.match(/[?&]v=([\w-]{11})/)||u.match(/youtu\.be\/([\w-]{11})/)||u.match(/youtube\.com\/(?:live|shorts|embed)\/([\w-]{11})/))){const v=await yt('videos',{part:'snippet',id:m[1]});if(v.items?.[0])c.push({id:v.items[0].snippet.channelId,video:m[1]})}
   else log('Could not read: '+u)}
   const a=await addChannels(c,log,true);log(`Added ${a} lead(s).`)}catch(e){log('Stopped: '+e.message)}}}

function guideV(){const L=(u,t)=>`<a href="${u}" target="_blank" rel="noopener">${t}</a>`;

 ${sec('Where you are now',li([

 ${sec('Two strategies, never mixed',li([

 ${sec('Rules that protect your sending reputation',li([

 ${sec('Step 2: Google Workspace direct (the recommended next step)',`<div>Works with the system as it is: real SMTP and IMAP with app passwords, so no code changes. Business Starter is about <b>$7 per user per month on an annual plan, $8.40 on monthly</b> (annual plans cannot drop seats until renewal).</div>`+li([

 ${sec('Sending when the Mac is off',li([

 $('#main').innerHTML=`<div class="card"><div class="grid">${f('key','YouTube API key','password')}${f('goal','Monthly goal ($)')}${f('daily','Daily outreach goal')}${f('minSubs','Min subscribers')}${f('minViews','Min median views on recent full episodes (0 = no filter)')}<div><label>Only work on likely motivated leads: Today, Find emails and Prepare clips skip the rest (1 = yes, 0 = no)</label><input data-k="onlyHot" type="number" min="0" max="1" value="${esc(g.onlyHot)}"></div>${f('hotScore','Motivation score needed (0 to 10; higher = pickier)')}${f('payMin','Signs of money needed besides a website: sponsors, sponsor reads, coaching, booking calls, running deals, hiring (0 to 5)')}<div><label>Only keep leads with a sign they can pay: sponsors, coaching, booking calls, running deals (1 = yes, 0 = no)</label><input data-k="needPay" type="number" min="0" max="1" value="${esc(g.needPay)}"></div>${f('maxSubs','Max subscribers')}${f('maxDays','Max days since last upload')}${f('followDays','Follow-up days')}${f('templates','Queries per niche (1-4)')}${f('geminiKey','Gemini API key (aistudio.google.com/apikey)','password')}${f('geminiModel','Gemini model','text')}<div><label>Skip podcasts with no contact info (1 = yes, 0 = no)</label><input data-k="skipNoContact" type="number" min="0" max="1" value="${esc(g.skipNoContact)}"></div><div><label>Use Gemini to structure pasted text (1 = yes, 0 = built in parser, free)</label><input data-k="useGeminiParse" type="number" min="0" max="1" value="${esc(g.useGeminiParse)}"></div><div><label>Max % Shorts in recent uploads (0 to 100, 100 = no filter)</label><input data-k="maxShorts" type="number" min="0" max="100" value="${esc(g.maxShorts)}"></div><div><label>Instagram only (1 = only queue leads with an Instagram, 0 = Instagram first, then X / TikTok / link)</label><input data-k="igOnly" type="number" min="0" max="1" value="${esc(g.igOnly)}"></div></div>

 $('#main').oninput=e=>{const k=e.target.dataset.k;if(!k)return;g[k]=e.target.type=='number'?+e.target.value:e.target.value;save()};

render();setSync(S.settings.syncUrl?'Sync on':'');mergePull();setTimeout(reconcileSent,3000);pollClipper();setInterval(pollClipper,6000);pollAwake();setInterval(pollAwake,10000);
async function pollHelperLabel(){const e=document.getElementById('hl');if(!e)return;try{const j=await (await fetch(RUNNER+'/log?since=999999999')).json();e.textContent=j.running&&j.label?'Helper busy: '+j.label:''}catch(x){e.textContent=''}}
pollHelperLabel();setInterval(pollHelperLabel,6000);{const a=document.getElementById('aw');if(a)a.onclick=()=>{const j=pollAwake.last;if(j&&j.on)awakeSet(false);else awakeSet(true,180)}}if(S.settings.apOn)setTimeout(apStart,8000);
